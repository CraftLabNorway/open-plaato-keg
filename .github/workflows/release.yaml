name: Release

on:
  push:
    branches:
      - master
      - next

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This branch may also be the head branch of an open PR against the
      # upstream repo we forked from. If so, every push here (including this
      # workflow's own version-bump commit below) shows up as an update on
      # that PR thread upstream, which is noisy for the upstream maintainer
      # and not what this automation is for. Skip the release/publish steps
      # entirely in that case; the branch still gets checked out for the
      # skip-detection itself, nothing else runs.
      - name: Check whether this branch backs an open upstream PR
        id: upstream_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(curl -s -H "Authorization: bearer $GH_TOKEN" \
            "https://api.github.com/repos/DarkJaeger/open-plaato-keg/pulls?state=open&head=${{ github.repository_owner }}:${{ github.ref_name }}" \
            | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Branch '${{ github.ref_name }}' backs $COUNT open upstream PR(s) against DarkJaeger/open-plaato-keg — skipping release/publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Elixir
        if: steps.upstream_pr.outputs.skip != 'true'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.16'
          otp-version: '26'

      - name: Install dependencies
        if: steps.upstream_pr.outputs.skip != 'true'
        run: mix deps.get

      - name: Run Credo linter
        if: steps.upstream_pr.outputs.skip != 'true'
        run: mix credo --strict

      - name: Set up QEMU for multi-arch builds
        if: steps.upstream_pr.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.upstream_pr.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.upstream_pr.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: paulhatch/semantic-version@v5.3.0
        if: steps.upstream_pr.outputs.skip != 'true'
        id: version

      - uses: softprops/action-gh-release@v2
        if: steps.upstream_pr.outputs.skip != 'true'
        id: create_release
        with:
          generate_release_notes: "true"
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write version to file
        if: steps.upstream_pr.outputs.skip != 'true'
        run: mkdir -p .release && echo "${{ steps.version.outputs.version }}" > .release/version

      - name: Commit and push version file
        if: steps.upstream_pr.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .release/version
          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(release): update version to ${{ steps.version.outputs.version }}"
            git push
          fi

      - name: Build and push Docker images
        if: steps.upstream_pr.outputs.skip != 'true'
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            DOCKER_TAG="latest"
          else
            DOCKER_TAG="${{ github.ref_name }}"
          fi
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ghcr.io/${REPO}:${{ steps.version.outputs.version }} \
            -t ghcr.io/${REPO}:${DOCKER_TAG} \
            --push .